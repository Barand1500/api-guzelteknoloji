<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Güzel Teknoloji API</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f5f7fa;font:14px Arial,sans-serif}button,input{font:inherit}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(920px,100%);background:#11151b;border:1px solid #2a313c;border-radius:16px;padding:28px;box-shadow:0 18px 70px #0008}.login{width:min(390px,100%);margin:auto}.logo{font-size:21px;font-weight:700;margin-bottom:24px}.muted{color:#9aa5b3}.field{display:grid;gap:7px;margin:14px 0}label{color:#bbc4d0}input{width:100%;background:#0a0d11;border:1px solid #3a4452;border-radius:9px;padding:12px;color:#fff;outline:0}input:focus{border-color:#339cff}button{border:0;border-radius:9px;padding:12px 16px;background:#147ee8;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#252c36}button.danger{background:#bd3b4b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #2a313c;padding-bottom:20px;margin-bottom:20px}.status{padding:6px 10px;border-radius:99px;background:#1b6e4b}.off{background:#71313b}.error{color:#ff7885;min-height:20px}.table{width:100%;border-collapse:collapse;margin-top:18px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #2a313c}.table button{padding:7px 10px;font-size:12px}.empty{text-align:center;padding:35px;color:#8d98a6}.hidden{display:none}.switch{display:flex;align-items:center;gap:8px}
  </style>
</head>
<body><main><section id="app" class="card"></section></main>
<script>
const app=document.getElementById('app'); let token=localStorage.getItem('guzel_api_token');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'İstek başarısız');return j}
function login(){app.innerHTML='<div class="login"><div class="logo">Güzel Teknoloji API</div><p class="muted">Yönetim paneline giriş yapın.</p><form id="login"><div class="field"><label>E-posta</label><input name="email" type="email" value="admin@guzelteknoloji.com" required></div><div class="field"><label>Şifre</label><input name="password" type="password" value="123456" required></div><div id="err" class="error"></div><button>Giriş yap</button></form></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const j=await request('/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});token=j.token;localStorage.setItem('guzel_api_token',token);dashboard()}catch(x){document.getElementById('err').textContent=x.message}}}
async function dashboard(){try{const j=await request('/admin/state');render(j.data)}catch{token=null;localStorage.removeItem('guzel_api_token');login()}}
function render(state){app.innerHTML='<div class="top"><div><div class="logo">API Yönetimi</div><div class="muted">api.guzelteknoloji.com</div></div><button id="logout" class="secondary">Çıkış</button></div><div class="row"><div class="switch"><strong>API durumu</strong><span id="badge" class="status '+(state.enabled?'':'off')+'">'+(state.enabled?'Aktif':'Kapalı')+'</span></div><button id="toggle" class="secondary">'+(state.enabled?'API’yi kapat':'API’yi aç')+'</button></div><hr style="border-color:#2a313c;margin:24px 0"><form id="add" class="row"><input name="name" placeholder="Veri adı (ör. banks)" required><input name="value" placeholder="Değer / JSON / URL" required><button>Ekle</button></form><div id="err" class="error"></div><table class="table"><thead><tr><th>Ad</th><th>Değer</th><th>Durum</th><th></th></tr></thead><tbody id="rows"></tbody></table>';
document.getElementById('logout').onclick=()=>{token=null;localStorage.removeItem('guzel_api_token');login()};document.getElementById('toggle').onclick=async()=>{const j=await request('/admin/state',{method:'PATCH',body:JSON.stringify({enabled:!state.enabled})});render(j.data)};document.getElementById('add').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await request('/admin/records',{method:'POST',body:JSON.stringify({name:f.get('name'),value:f.get('value')})});dashboard()}catch(x){document.getElementById('err').textContent=x.message}};loadRows()}
async function loadRows(){const j=await request('/admin/records');const body=document.getElementById('rows');if(!j.data.length){body.innerHTML='<tr><td colspan="4" class="empty">Henüz veri eklenmedi.</td></tr>';return}body.innerHTML=j.data.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.value)+'</td><td>'+ (x.active?'Aktif':'Kapalı')+'</td><td><button class="secondary" data-id="'+x.id+'">Sil</button></td></tr>').join('');body.querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(confirm('Bu kayıt silinsin mi?')){await request('/admin/records/'+b.dataset.id,{method:'DELETE'});dashboard()}})}
if(token)dashboard();else login();
</script></body></html>
