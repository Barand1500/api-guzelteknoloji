<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Güzel Teknoloji API</title><style>body{margin:0;background:#f4f7fb;color:#172334;font:14px system-ui}.shell{display:flex;min-height:100vh}.side{width:230px;background:#101722;color:#dbe7f5;padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;margin-bottom:35px}.brand i{color:#4aa6ff;font-style:normal}.nav button{display:block;width:100%;margin:6px 0;padding:12px;border:0;border-radius:9px;text-align:left;background:transparent;color:#aebdd0}.nav button:first-child,.nav button:hover{background:#176fd1;color:#fff}.side small{margin-top:auto;color:#75869c}.content{width:100%;max-width:1400px;padding:35px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{color:#718096;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.title{font-size:30px;margin:6px 0}.card{background:#fff;border:1px solid #e1e8f0;border-radius:16px;padding:22px;box-shadow:0 10px 28px #24364d0b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.stat strong{display:block;font-size:27px;margin:8px 0}.stat p{color:#718096;margin:0 0 9px}.status{background:#dff7e9;color:#147343;border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px}.off{background:#ffe1e5;color:#ac2e3d}.btn{background:#176fd1;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.muted{background:#edf3f9;color:#38506c}.danger{background:#ffedef;color:#ae3040}.grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#607088}.field input,.field textarea{border:1px solid #d5dfeb;border-radius:9px;padding:11px;outline:0;background:#fbfdff}.field input:focus,.field textarea:focus{border-color:#318fe6}.table{border-collapse:collapse;width:100%;margin-top:18px}.table th,.table td{text-align:left;padding:13px 9px;border-bottom:1px solid #edf1f5}.table th{font-size:11px;color:#718096;text-transform:uppercase}.error{color:#d33b4d;min-height:20px}.login{min-height:100vh;background:#0b1018;display:grid;place-items:center}.login form{width:min(380px,calc(100% - 32px));background:#141d2a;border:1px solid #2b3b52;border-radius:16px;padding:30px;color:#fff}.login h1{margin:0 0 8px}.login p{color:#98a8bb;margin:0 0 22px}.login input{background:#0d141e;color:#fff;border-color:#354961}@media(max-width:800px){.side{width:65px;padding:20px 9px}.brand{font-size:0}.brand i{font-size:18px}.nav button{font-size:0;text-align:center}.content{padding:18px}.stats,.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const A=document.getElementById('app');let t=localStorage.getItem('api_token'),S;async function q(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})}}),j=await r.json();if(!r.ok)throw Error(j.message||'İstek başarısız');return j}function login(){A.innerHTML='<div class="login"><form id="f"><h1>Güzel Teknoloji API</h1><p>Yönetim merkezine giriş yapın.</p><div class="field"><label>E-posta</label><input name="email" type="email" value="admin@guzelteknoloji.com"></div><div class="field"><label>Şifre</label><input name="password" type="password" value="123456"></div><div class="error" id="e"></div><button class="btn">Giriş yap</button></form></div>';f.onsubmit=async x=>{x.preventDefault();let d=new FormData(f);try{let j=await q('/auth/login',{method:'POST',body:JSON.stringify({email:d.get('email'),password:d.get('password')})});t=j.token;localStorage.setItem('api_token',t);dash()}catch(x){e.textContent=x.message}}}async function dash(){try{S=(await q('/admin/state')).data;let r=S.records||[];A.innerHTML='<div class="shell"><aside class="side"><div class="brand">Güzel <i>Teknoloji</i></div><nav class="nav"><button>▦ Genel Bakış</button><button>▤ Veri Kategorileri</button><button>⚙ API Ayarları</button></nav><small>API yönetim paneli</small></aside><main class="content"><div class="top"><div><div class="eyebrow">API Yönetim Merkezi</div><h1 class="title">Genel Bakış</h1></div><div><span class="status '+(S.enabled?'':'off')+'">● '+(S.enabled?'API aktif':'API kapalı')+'</span> <button id="out" class="btn muted">Çıkış</button></div></div><div class="stats"><div class="card stat"><p>Toplam kayıt</p><strong>'+r.length+'</strong><p>Veritabanı kayıtları</p></div><div class="card stat"><p>Aktif kayıt</p><strong>'+r.filter(x=>x.active).length+'</strong><p>Yayınlanan veriler</p></div><div class="card stat"><p>Servis</p><strong>'+(S.enabled?'Açık':'Kapalı')+'</strong><button id="toggle" class="btn muted">Durumu değiştir</button></div></div><div class="grid"><section class="card"><div class="eyebrow">Yeni veri</div><h2>Kayıt oluştur</h2><form id="add"><div class="field"><label>Kategori adı</label><input name="name" placeholder="banks, bins, locations" required></div><div class="field"><label>Değer / JSON</label><textarea name="value" rows="7" required></textarea></div><div class="error" id="er"></div><button class="btn">Veriyi kaydet</button></form></section><section class="card"><div class="eyebrow">Veri kataloğu</div><h2>Kayıtlar</h2><table class="table"><tr><th>Kategori</th><th>Değer</th><th></th></tr>'+ (r.length?r.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+String(x.value).slice(0,80)+'</td><td><button class="btn danger" data-id="'+x.id+'">Sil</button></td></tr>').join(''):'<tr><td colspan="3">Henüz kayıt eklenmedi.</td></tr>')+'</table></section></div></main></div>';out.onclick=()=>{localStorage.removeItem('api_token');t=null;login()};toggle.onclick=async()=>{S=(await q('/admin/state',{method:'PATCH',body:JSON.stringify({enabled:!S.enabled})})).data;dash()};add.onsubmit=async x=>{x.preventDefault();let d=new FormData(add);try{await q('/admin/records',{method:'POST',body:JSON.stringify({name:d.get('name'),value:d.get('value')})});dash()}catch(x){er.textContent=x.message}};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(confirm('Kayıt silinsin mi?')){await q('/admin/records/'+b.dataset.id,{method:'DELETE'});dash()}})}catch{t=null;login()}}if(t)dash();else login();</script></body></html>
